<!DOCTYPE html>

<html>

<head>

<title></title>

<link rel="stylesheet" href="style.css">

<link rel="canonical" id="canonical">

</head>


<body>


<div id="postContent"></div>



<script src="posts.js"></script>


<script>


const file =
location.pathname.split("/").pop();


const post =
posts.find(p=>p.url === file);



if(post){


document.title =
post.title;



document.getElementById("canonical")
.href =
location.href;



document.getElementById("postContent")
.innerHTML = `


<img src="${post.image}"
alt="${post.title}">


<h1>${post.title}</h1>


${post.content}



`;

}



</script>


</body>

</html>
